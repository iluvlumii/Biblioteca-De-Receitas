<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca de Receitas</title>
  <link rel="stylesheet" href="../static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="cabecalho">
    <div class="container">
      <a href="index.html" class="marca-link">
        <img src="../assets/logo.jpg" alt="Logo Biblioteca de Receitas" class="logo-img">
        <span class="marca">Biblioteca de Receitas</span>
      </a>
      <a href="login.html" class="botao botao-secundario">
        <i class="fa-solid fa-user" aria-hidden="true"></i> Acessar conta
      </a>
    </div>
  </header>

  <nav class="container menu" aria-label="Navegação principal">
    <a href="index.html" class="menu-link ativo" aria-current="page">
      <i class="fa-solid fa-house" aria-hidden="true"></i> Início
    </a>
    <a href="#" class="menu-link">
      <i class="fa-solid fa-basket-shopping" aria-hidden="true"></i> O que tenho em casa
    </a>
    <a href="#" class="menu-link">
      <i class="fa-solid fa-lightbulb" aria-hidden="true"></i> Dicas de conservação
    </a>
    <a href="#" class="menu-link">
      <i class="fa-solid fa-comments" aria-hidden="true"></i> Comunidade
    </a>
  </nav>

  <main class="container">
    <section class="hero">
      <img src="../assets/logo.jpg" alt="Biblioteca de Receitas - Tradição e Sabor" class="hero-img">
      <h1>Nada de jogar comida fora</h1>
      <p class="hero-descricao">
        Aqui você diz o que sobrou na sua cozinha e a gente mostra receitas simples, passo a passo.
      </p>
      <a href="#" class="botao botao-principal botao-grande">
        <span>Começar: o que tenho em casa</span>
        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
      </a>
    </section>
  </main>

  <footer class="rodape">Biblioteca de Receitas</footer>

</body>
</html>
